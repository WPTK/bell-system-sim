[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bell-system-unix-v7"
version = "2.1.0"
authors = [
    {name = "Bell System Operations Simulation Project"},
]
description = "Bell System UNIX V7 terminal simulation (1978-1983)"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: System :: Systems Administration",
    "Topic :: Terminals",
]
keywords = ["bell-system", "unix", "terminal", "simulation", "historical", "telecommunications"]

[project.urls]
Homepage = "https://github.com/WPTK/bell-system-sim"
Repository = "https://github.com/WPTK/bell-system-sim"
Issues = "https://github.com/WPTK/bell-system-sim/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[project.scripts]
bell-system = "bell_system.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["bell_system*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ['py38']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py38"
exclude = ["build", "dist", "attached_assets"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E741"]
